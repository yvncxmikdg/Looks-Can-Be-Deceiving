# CHANGE-task transition of BDA_vanillavit_small_segmenter.yaml (wave-3 paper arm:
# ViT-S->Segmenter, trained from scratch). ViT-Small = embed_dim 384, 6 heads, 12 layers.
#
# CORRECTION vs the BDA source: same latent bug as the ViT-M Segmenter source -- the decoder was
# left at the 1024-dim ScaleMAE Segmenter values, but the head's patch_proj = Linear(in_channels,
# embed_dims) requires in_channels == encoder embed_dim (384), so the source shape-crashes at the
# first forward pass. Here the decoder is matched to the ViT-S encoder (384 dim, 6 heads), the
# canonical Segmenter design. Task surface matches the CHANGE arms.
name: "CHANGE_Segmenter_small_Vanilla_ViT_CCE"
model_type: "MaskedEncoderDecoder"
encoder_type: "ViT"
decoder_type: "Segmenter"
task: "CHANGE"
input:
  normalized_inputs: true
  mask_input: false
training:
  training_parameters:
    gradient_clip_val: 10.0
    alpha: 0.25
    batch_size: 2
    gamma: 2
    grad_accumulation: 8
    l1_reg: 1.0e-06
    l2_reg: 1.0e-05
    log_images_every_n_steps: 100
    output_class_weights_strategy: "ipw"
    normalize_weights: False
    mask_x: 512
    mask_y: 512
    max_epochs: 4000
    optimizer_parameters:
      name: "AdamW"
      lr: 0.0005
      weight_decay: 0.00001
    tile_x: 512
    tile_y: 512
    loss_parameters:
      loss: [["cross entropy", 1.0]]
      gamma: 2
      alpha: 0.25
      bins: 10
      momentum: 0.9
      smooth: 1.0e-06
validation:
  validation_parameters:
    batch_size: 2
    validation_monitor: "val_macro_f1"
    validation_monitor_mode: "max"
    # See CHANGE_scalemae_upernet_pretrained.yaml: scheduler follows val loss, early stopping off.
    validation_scheduler_monitor: "val_criterion_loss"
    validation_scheduler_monitor_mode: "min"
    validation_early_stopping_patience: 0
    validation_checkpoint_save_top_k: 3
    validation_reduce_lr_on_plateau_patience: 8
    validation_reduce_lr_on_plateau_cooldown: 3
model_parameters:
  decoder_parameters:
    in_channels: 384
    channels: 384
    num_layers: 2
    num_heads: 6
    embed_dims: 384
    dropout_ratio: 0.1
    align_corners: False
    out_indicies: [2,9,16,23]
  n_cls: 3
  normalization: "vit"
  encoder_parameters:
    backbone: "vit"
    patch_size: 16
    n_heads: 6
    n_layers: 12
    mlp_ratio: 4
    embed_dim: 384
