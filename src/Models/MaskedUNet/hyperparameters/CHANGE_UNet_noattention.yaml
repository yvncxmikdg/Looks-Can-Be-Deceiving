# Vanilla-UNet ablation of CHANGE_UNet_attention.yaml: identical in every respect except the
# attention gates on the five up blocks are disabled. Paper arm for the architecture comparison.
name: "CHANGE_UNet_v1_CCE_NoAttention"
model_type: "MaskedTower"
model: "MaskedUNetTowerModule"
task: "CHANGE"
input:
  normalized_inputs: true
  mask_input: true
training:
  training_parameters:
    gradient_clip_val: 10.0
    batch_size: 4
    grad_accumulation: 16
    log_images_every_n_steps: 100
    l1_reg: 0.0000001
    l2_reg: 0.000001
    mask_x: 512
    mask_y: 512
    max_epochs: 4000
    optimizer_parameters:
      name: "AdamW"
      weight_decay: 0.00001
      lr: 0.0001
    output_class_weights_strategy: "ipw"
    normalize_weights: False
    tile_x: 512
    tile_y: 512
    loss_parameters:
      loss: [["cross entropy", 1.0]]
      gamma: 2
      alpha: 0.25
      bins: 10
      momentum: 0.9
      smooth: 1.0e-06
validation:
  validation_parameters:
    batch_size: 6
    validation_monitor: "val_macro_f1"
    validation_monitor_mode: "max"
    # The LR schedule follows val loss, not the checkpoint monitor: an early-epoch macro-F1 fluke
    # (observed: epoch-0 0.4598, never re-passed in 126 epochs) otherwise decays the LR to zero
    # while the loss is still falling.
    validation_scheduler_monitor: "val_criterion_loss"
    validation_scheduler_monitor_mode: "min"
    # Early stopping watches the macro-F1 monitor, so the same fluke would kill long runs at
    # ~epoch patience+1. Disabled until the metric is stable enough to trust.
    validation_early_stopping_patience: 0
    validation_checkpoint_save_top_k: 3
    validation_reduce_lr_on_plateau_patience: 8 # FROM 5
    validation_reduce_lr_on_plateau_cooldown: 3
model_parameters:
  layers:
    inc:
      out_channels: 32
      dilation: 1
      kernel_size: 5
      padding_mode: "reflect"
    down_1:
      in_channels: 32
      out_channels: 64
      dilation: 1
      kernel_size: 5
      padding_mode: "reflect"
    down_2:
      in_channels: 64
      out_channels: 128
      dilation: 1
      kernel_size: 5
      padding_mode: "reflect"
    down_3:
      in_channels: 128
      out_channels: 256
      dilation: 1
      kernel_size: 5
      padding_mode: "reflect"
    down_4:
      in_channels: 256
      out_channels: 512
      dilation: 1
      kernel_size: 5
      padding_mode: "reflect"
    down_5:
      in_channels: 512
      out_channels: 1024
      dilation: 1
      kernel_size: 5
      padding_mode: "reflect"
    up_0:
      attention: False
      bilinear: False
      in_channels: 1024
      out_channels: 512
    up_1:
      attention: False
      bilinear: False
      in_channels: 512
      out_channels: 256
    up_2:
      attention: False
      bilinear: False
      in_channels: 256
      out_channels: 128
    up_3:
      attention: False
      bilinear: False
      in_channels: 128
      out_channels: 64
    up_4:
      attention: False
      bilinear: False
      in_channels: 64
      out_channels: 32