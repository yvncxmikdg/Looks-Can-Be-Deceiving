# Migrated to the new train.py format (top-level model_type/training/validation), matching the
# Attention_ZampieriEtAl2018 debug config's pattern, while preserving input.training_parameters/
# input.validation_parameters for the BDAADJ-specific keys TaskModuleBDAADJ still reads from there
# (adj_teacher_force, adjustment_class_loss_weights, validation_sample_generation_strategy,
# validation_generate_adjusted_samples). No hyperparameter VALUES changed from the pre-migration
# version of this file - this is a pure schema reshape (the old schema predates the "wire BDAADJ
# onto the new training pipeline" commits and fails to load under the current infer.py/train.py
# with KeyError: 'model_type' then KeyError: 'validation').
# Channels live in their own file - see data_envs/Tasks/BDA/Channels/bdaadj_zampieri_v1_channels.yaml.
name: "ADJBDA_UNet_v1"
model_type: "Tower"
model: "ZampieriEtAl2018"
task: "BDAADJ"
validation:
  validation_parameters:
    batch_size: 1
    validation_monitor: "val_ortho_inference_avg_IoU"
    validation_monitor_mode: "max"
    validation_checkpoint_save_top_k: 3
    validation_reduce_lr_on_plateau_patience: 50
    validation_reduce_lr_on_plateau_cooldown: 5
training:
  training_parameters:
    batch_size: 4
    grad_accumulation: 16
    max_epochs: 100
    samples_per_epoch: 8000
    gradient_clip_val: 100.0
    alpha: 0.25
    gamma: 2
    l1_reg: 1.0e-07
    l2_reg: 1.0e-08
    log_images_every_n_steps: 100
    normalize_weights: false
    output_class_weights_strategy: "manual"
    output_class_weights:
      background: 1.0e-06
      destroyed: 23.706
      major damage: 9.852
      minor damage: 3.193
      no damage: 1.95
      un-classified: 35.23
    optimizer_parameters:
      name: "AdamW"
      lr: 5.0e-4
    mask_x: 2048
    mask_y: 2048
    tile_x: 2048
    tile_y: 2048
    loss_parameters:
      loss: [["cross entropy", 1.0]]
      gamma: 2
      alpha: 0.25
      bins: 10
      momentum: 0.9
      smooth: 1.0e-06
input:
  normalized_inputs: true
  mask_input: true
  validation_parameters:
    validation_sample_generation_strategy: "center"
    validation_generate_adjusted_samples: false
  training_parameters:
    adj_teacher_force: true
    adjustment_class_loss_weights:
      background: 1.0e-06
      destroyed: 0.25
      major damage: 0.5
      minor damage: 1.0
      no damage: 1.0
      un-classified: 0.0
model_parameters:
  chain_steps: 4
  initial_x_dim: 256
  initial_y_dim: 256
  mask_channel: 3
  chain_combination_strategy: "composition"
