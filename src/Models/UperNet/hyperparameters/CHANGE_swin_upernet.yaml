# CHANGE-task transition of BDA_swin_upernet.yaml (wave-2 paper arm: Swin->UperNet).
# NOTE the builder truth (UperNet.py "swin" branch): the encoder is a hardcoded SwinTransformer
# with depths [2,2,6,2] / embed 96 -- i.e. Swin-TINY, TRAINED FROM SCRATCH (no pretrained
# init) -- and the encoder_parameters block below plus the decoder norm_cfg are NOT read by
# that branch (the decode/aux heads use hardcoded GroupNorm); both are inherited verbatim from
# the BDA yaml for provenance. Task surface matches the CHANGE baseline arms.
name: "CHANGE_UperNet_swin_CCE"
model_type: "MaskedTower"
model: "MaskedUperNet"
task: "CHANGE"
input:
  normalized_inputs: true
  mask_input: false
training:
  training_parameters:
    alpha: 0.25
    batch_size: 1
    gamma: 2
    grad_accumulation: 16
    l1_reg: 1.0e-09
    l2_reg: 1.0e-08
    log_images_every_n_steps: 100
    output_class_weights_strategy: "ipw"
    normalize_weights: False
    mask_x: 512
    mask_y: 512
    max_epochs: 4000
    optimizer_parameters:
      name: "AdamW"
      lr: 0.0005
      weight_decay: 0.0005
    tile_x: 512
    tile_y: 512
    loss_parameters:
      loss: [["cross entropy", 1.0]]
      gamma: 2
      alpha: 0.25
      bins: 10
      momentum: 0.9
      smooth: 1.0e-06
validation:
  validation_parameters:
    batch_size: 1
    validation_monitor: "val_macro_f1"
    validation_monitor_mode: "max"
    # See CHANGE_scalemae_upernet_pretrained.yaml: scheduler follows val loss, early stopping off.
    validation_scheduler_monitor: "val_criterion_loss"
    validation_scheduler_monitor_mode: "min"
    validation_early_stopping_patience: 0
    validation_checkpoint_save_top_k: 3
    validation_reduce_lr_on_plateau_patience: 8
    validation_reduce_lr_on_plateau_cooldown: 3
model_parameters:
  decoder_parameters:
    in_channels: [96, 192, 384, 768]
    in_index: [0,1,2,3]
    pool_scales: [1,2,3,6]
    channels: 512
    dropout_ratio: 0.1
    norm_cfg:
      type: 'SyncBN'
      requires_grad: True
    align_corners: False
    out_indicies: [2,9,16,23]
  n_cls: 3
  encoder_name: "swin"
  encoder_parameters:
    depth: 101
    num_stages: 4
    out_indices: [0, 1, 2, 3]
    dilations: [1, 1, 2, 4]
    strides: [1, 2, 1, 1]
    norm_eval: False
    contract_dilation: True
